<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClipCatcher · Mis vídeos</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <a class="brand" href="dashboard.html">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3Z"/>
          <path d="m6.2 5.3 3.1 3.9"/>
          <path d="m12.4 3.4 3.1 4"/>
          <path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>
        </svg>
        <span class="brand-text">ClipCatcher</span>
      </a>
      <div class="row">
        <span class="user-pill" id="user-pill">…</span>
        <a class="btn btn-ghost" href="account.html">
          <i data-lucide="settings"></i> Mi cuenta
        </a>
        <button class="btn btn-ghost" id="btn-logout" type="button">
          <i data-lucide="log-out"></i> Cerrar sesión
        </button>
      </div>
    </header>

    <section>
      <div class="row row-between" style="margin-bottom: 22px;">
        <div>
          <h1>Mis vídeos</h1>
          <p class="lead">Sube un vídeo y ClipCatcher detectará los highlights.</p>
        </div>
        <a class="btn btn-primary" href="upload.html">
          <i data-lucide="upload-cloud"></i> Subir nuevo vídeo
        </a>
      </div>

      <div id="alert-slot"></div>

      <div id="videos-slot">
        <div class="card-grid" id="skeleton-grid">
          <!-- 3 skeleton cards animadas mientras llega listVideos(). -->
          <div class="skeleton-card">
            <div class="skeleton-line skeleton-title"></div>
            <div class="skeleton-line skeleton-meta"></div>
            <div class="skeleton-line skeleton-meta"></div>
          </div>
          <div class="skeleton-card">
            <div class="skeleton-line skeleton-title"></div>
            <div class="skeleton-line skeleton-meta"></div>
            <div class="skeleton-line skeleton-meta"></div>
          </div>
          <div class="skeleton-card">
            <div class="skeleton-line skeleton-title"></div>
            <div class="skeleton-line skeleton-meta"></div>
            <div class="skeleton-line skeleton-meta"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module">
    import { listVideos, getMe, deleteVideo, ApiError } from './js/api.js';
    import { requireAuth, logout } from './js/auth.js';
    import { showToast } from './js/toast.js';
    import { confirmModal } from './js/modal.js';

    // Drena toasts dejados por otras paginas (login OAuth, upload, etc).
    // Se hace antes del primer render para que aparezcan inmediatamente.
    const _toastOAuth = sessionStorage.getItem('toast.oauth.success');
    if (_toastOAuth) {
      sessionStorage.removeItem('toast.oauth.success');
      showToast(_toastOAuth, 'success');
    }

    if (!requireAuth()) throw new Error('redirigiendo');

    // Renderiza iconos estaticos del header al cargar la pagina.
    if (window.lucide) window.lucide.createIcons();

    const userPill = document.getElementById('user-pill');
    const slot = document.getElementById('videos-slot');
    const alertSlot = document.getElementById('alert-slot');
    document.getElementById('btn-logout').addEventListener('click', logout);

    function showAlert(kind, msg) {
      alertSlot.innerHTML = `<div class="alert alert-${kind}">${msg}</div>`;
    }

    function fmtDate(iso) {
      try { return new Date(iso).toLocaleString('es-ES'); } catch (_) { return iso; }
    }

    // Icono trash-2 inline (no Lucide CDN: el boton aparece sobre cards
    // recien renderizadas y `lucide.createIcons()` puede no haber pasado
    // todavia por ahi).
    const TRASH_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>';

    function renderVideos(videos) {
      if (!videos.length) {
        slot.innerHTML = `
          <div class="empty">
            <i class="empty-icon" data-lucide="clapperboard"></i>
            <h3>Aún no hay vídeos</h3>
            <p>Sube tu primera grabación y deja que ClipCatcher encuentre los mejores momentos.</p>
            <a class="btn btn-primary" href="upload.html">
              <i data-lucide="upload-cloud"></i> Subir mi primer vídeo
            </a>
          </div>`;
        if (window.lucide) window.lucide.createIcons();
        return;
      }
      const cards = videos.map(v => {
        const status = v.status || 'uploaded';
        const icon = statusIcon(status);
        const spinClass = status === 'processing' ? ' spin-loader' : '';
        // El card es un div; el <a> de navegacion va dentro y el boton
        // borrar es hermano del <a> (no se puede anidar <button> dentro
        // de <a>: HTML invalido). Asi cada elemento captura sus clicks.
        return `
          <div class="video-card">
            <a class="video-card-link" href="video.html?id=${v.id}">
              <span class="filename">${escapeHtml(v.original_filename)}</span>
              <div class="meta">
                <span>#${v.id}</span>
                <span class="status status-${status}${spinClass}">
                  <i data-lucide="${icon}"></i>${status}
                </span>
              </div>
              <div class="meta">
                <span>${fmtDate(v.uploaded_at)}</span>
              </div>
            </a>
            <button class="btn-card-delete" type="button"
                    data-delete-id="${v.id}"
                    data-delete-name="${escapeHtml(v.original_filename)}"
                    aria-label="Borrar vídeo">${TRASH_SVG}</button>
          </div>`;
      }).join('');
      slot.innerHTML = `<div class="card-grid">${cards}</div>`;
      if (window.lucide) window.lucide.createIcons();

      // Enlazar handler de borrado en cada boton.
      slot.querySelectorAll('.btn-card-delete').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.preventDefault();
          e.stopPropagation();
          const id = parseInt(btn.dataset.deleteId, 10);
          const name = btn.dataset.deleteName || `vídeo #${id}`;
          const ok = await confirmModal({
            title: '¿Borrar este vídeo?',
            body: `Vas a borrar "${name}" y todos sus clips. Esta acción no se puede deshacer.`,
            confirmLabel: 'Borrar',
            cancelLabel: 'Cancelar',
            confirmVariant: 'danger',
            icon: 'trash-2',
          });
          if (!ok) return;
          btn.disabled = true;
          try {
            await deleteVideo(id);
            showToast('Vídeo eliminado', 'success');
            // Recargar la lista para reflejar el estado.
            const fresh = await listVideos();
            renderVideos(fresh);
          } catch (err) {
            const msg = err.detail || err.message || 'No se pudo borrar el vídeo.';
            showToast(msg, 'error', 5000);
            btn.disabled = false;
          }
        });
      });
    }

    function statusIcon(status) {
      return {
        uploaded: 'clock',
        processing: 'loader',
        done: 'check-circle',
        failed: 'x-circle',
      }[status] || 'circle';
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }

    (async () => {
      try {
        const me = await getMe();
        userPill.textContent = me.email;
      } catch (err) {
        if (err instanceof ApiError && err.status === 401) return;
        userPill.textContent = '—';
      }
      try {
        const videos = await listVideos();
        renderVideos(videos);
      } catch (err) {
        slot.innerHTML = '';
        showAlert('error', err.detail || 'No se pudieron cargar los vídeos.');
      }
    })();
  </script>
</body>
</html>
