<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClipCatcher · Mis vídeos</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <a class="brand" href="dashboard.html">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3Z"/>
          <path d="m6.2 5.3 3.1 3.9"/>
          <path d="m12.4 3.4 3.1 4"/>
          <path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>
        </svg>
        <span class="brand-text">ClipCatcher</span>
      </a>
      <div class="row">
        <span class="user-pill" id="user-pill">…</span>
        <a class="btn btn-ghost" href="account.html">
          <i data-lucide="settings"></i> Mi cuenta
        </a>
        <button class="btn btn-ghost" id="btn-logout" type="button">
          <i data-lucide="log-out"></i> Cerrar sesión
        </button>
      </div>
    </header>

    <section>
      <div class="row row-between" style="margin-bottom: var(--space-5);">
        <div>
          <h1>Mis vídeos</h1>
          <p class="lead">Sube un vídeo y ClipCatcher detectará los highlights.</p>
        </div>
        <a class="btn btn-primary" href="upload.html">
          <i data-lucide="upload-cloud"></i> Subir nuevo vídeo
        </a>
      </div>

      <div id="alert-slot"></div>

      <!-- Panel de stats (F9.4). Lo rellena renderStats() y se queda
           oculto si videos_count == 0 (cuenta nueva). -->
      <div id="stats-slot" class="hidden"></div>

      <div id="videos-slot">
        <div class="card-grid" id="skeleton-grid">
          <!-- 3 skeleton cards animadas mientras llega listVideos(). -->
          <div class="skeleton-card">
            <div class="skeleton-line skeleton-title"></div>
            <div class="skeleton-line skeleton-meta"></div>
            <div class="skeleton-line skeleton-meta"></div>
          </div>
          <div class="skeleton-card">
            <div class="skeleton-line skeleton-title"></div>
            <div class="skeleton-line skeleton-meta"></div>
            <div class="skeleton-line skeleton-meta"></div>
          </div>
          <div class="skeleton-card">
            <div class="skeleton-line skeleton-title"></div>
            <div class="skeleton-line skeleton-meta"></div>
            <div class="skeleton-line skeleton-meta"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module">
    import { listVideos, getVideo, getMe, getMyStats, deleteVideo, fetchClipBlobUrl, ApiError } from './js/api.js';
    import { requireAuth, logout } from './js/auth.js';
    import { showToast } from './js/toast.js';
    import { confirmModal } from './js/modal.js';

    // Drena toasts dejados por otras paginas (login OAuth, upload, etc).
    // Se hace antes del primer render para que aparezcan inmediatamente.
    const _toastOAuth = sessionStorage.getItem('toast.oauth.success');
    if (_toastOAuth) {
      sessionStorage.removeItem('toast.oauth.success');
      showToast(_toastOAuth, 'success');
    }

    if (!requireAuth()) throw new Error('redirigiendo');

    // Renderiza iconos estaticos del header al cargar la pagina.
    if (window.lucide) window.lucide.createIcons();

    const userPill = document.getElementById('user-pill');
    const slot = document.getElementById('videos-slot');
    const alertSlot = document.getElementById('alert-slot');
    const statsSlot = document.getElementById('stats-slot');
    document.getElementById('btn-logout').addEventListener('click', logout);

    // Iconos inline (no Lucide CDN) para que el panel de stats se pinte
    // de inmediato sin esperar a createIcons() en cada refresh.
    const ICON_VIDEO = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 8-6 4 6 4V8Z"/><rect width="14" height="12" x="2" y="6" rx="2" ry="2"/></svg>';
    const ICON_SCISSORS = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><line x1="20" y1="4" x2="8.12" y2="15.88"/><line x1="14.47" y1="14.48" x2="20" y2="20"/><line x1="8.12" y1="8.12" x2="12" y2="12"/></svg>';
    const ICON_CLOCK = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';

    function fmtAvg(seconds) {
      if (seconds == null) return '—';
      if (seconds < 60) return `${seconds.toFixed(1)}s`;
      const m = Math.floor(seconds / 60);
      const s = Math.round(seconds % 60);
      return `${m}m ${s}s`;
    }

    function renderStats(stats) {
      // Si la cuenta es nueva (sin videos), ocultar el panel — solo
      // empieza a tener sentido cuando hay datos reales.
      if (!stats || !stats.videos_count) {
        statsSlot.classList.add('hidden');
        statsSlot.innerHTML = '';
        return;
      }
      statsSlot.classList.remove('hidden');
      statsSlot.innerHTML = `
        <div class="stats-panel">
          <div class="stat-card">
            <span class="stat-icon">${ICON_VIDEO}</span>
            <div class="stat-text">
              <span class="stat-label">Vídeos procesados</span>
              <span class="stat-value">${stats.videos_count}</span>
            </div>
          </div>
          <div class="stat-card">
            <span class="stat-icon">${ICON_SCISSORS}</span>
            <div class="stat-text">
              <span class="stat-label">Clips generados</span>
              <span class="stat-value">${stats.clips_count}</span>
            </div>
          </div>
          <div class="stat-card">
            <span class="stat-icon">${ICON_CLOCK}</span>
            <div class="stat-text">
              <span class="stat-label">Tiempo medio</span>
              <span class="stat-value">${fmtAvg(stats.avg_processing_seconds)}</span>
            </div>
          </div>
        </div>`;
    }

    function showAlert(kind, msg) {
      alertSlot.innerHTML = `<div class="alert alert-${kind}">${msg}</div>`;
    }

    function fmtDate(iso) {
      try { return new Date(iso).toLocaleString('es-ES'); } catch (_) { return iso; }
    }

    // Icono trash-2 inline (no Lucide CDN: el boton aparece sobre cards
    // recien renderizadas y `lucide.createIcons()` puede no haber pasado
    // todavia por ahi).
    const TRASH_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-2 14a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>';

    function renderVideos(videos) {
      if (!videos.length) {
        slot.innerHTML = `
          <div class="empty">
            <i class="empty-icon" data-lucide="clapperboard"></i>
            <h3>Aún no hay vídeos</h3>
            <p>Sube tu primera grabación y deja que ClipCatcher encuentre los mejores momentos.</p>
            <a class="btn btn-primary" href="upload.html">
              <i data-lucide="upload-cloud"></i> Subir mi primer vídeo
            </a>
          </div>`;
        if (window.lucide) window.lucide.createIcons();
        return;
      }
      const cards = videos.map(v => {
        const status = v.status || 'uploaded';
        const icon = statusIcon(status);
        const spinClass = status === 'processing' ? ' spin-loader' : '';
        // El card es un div; el <a> de navegacion va dentro y el boton
        // borrar es hermano del <a> (no se puede anidar <button> dentro
        // de <a>: HTML invalido). Asi cada elemento captura sus clicks.
        return `
          <div class="video-card">
            <a class="video-card-link" href="video.html?id=${v.id}">
              <span class="filename">${escapeHtml(v.original_filename)}</span>
              <div class="meta">
                <span>#${v.id}</span>
                <span class="status status-${status}${spinClass}">
                  <i data-lucide="${icon}"></i>${status}
                </span>
              </div>
              <div class="meta">
                <span>${fmtDate(v.uploaded_at)}</span>
              </div>
            </a>
            <button class="btn-card-delete" type="button"
                    data-delete-id="${v.id}"
                    data-delete-name="${escapeHtml(v.original_filename)}"
                    aria-label="Borrar vídeo">${TRASH_SVG}</button>
          </div>`;
      }).join('');
      slot.innerHTML = `<div class="card-grid">${cards}</div>`;
      if (window.lucide) window.lucide.createIcons();

      // F9.6: hover preview en cards con status === 'done'.
      slot.querySelectorAll('.video-card').forEach(card => {
        const link = card.querySelector('.video-card-link');
        if (!link) return;
        // El video id sale del href de navegacion, asi no anadimos data-attrs.
        const m = (link.getAttribute('href') || '').match(/id=(\d+)/);
        if (!m) return;
        const vid = parseInt(m[1], 10);
        // Solo activamos preview en cards 'done' (las demas no tienen
        // clip todavia o han fallado).
        const statusEl = card.querySelector('.status');
        if (!statusEl || !statusEl.classList.contains('status-done')) return;
        attachHoverPreview(card, vid);
      });

      // Enlazar handler de borrado en cada boton.
      slot.querySelectorAll('.btn-card-delete').forEach(btn => {
        btn.addEventListener('click', async (e) => {
          e.preventDefault();
          e.stopPropagation();
          const id = parseInt(btn.dataset.deleteId, 10);
          const name = btn.dataset.deleteName || `vídeo #${id}`;
          const ok = await confirmModal({
            title: '¿Borrar este vídeo?',
            body: `Vas a borrar "${name}" y todos sus clips. Esta acción no se puede deshacer.`,
            confirmLabel: 'Borrar',
            cancelLabel: 'Cancelar',
            confirmVariant: 'danger',
            icon: 'trash-2',
          });
          if (!ok) return;
          btn.disabled = true;
          try {
            await deleteVideo(id);
            showToast('Vídeo eliminado', 'success');
            // Recargar lista y stats en paralelo para reflejar el estado.
            const [fresh, freshStats] = await Promise.all([
              listVideos(),
              getMyStats().catch(() => null),
            ]);
            renderVideos(fresh);
            if (freshStats) renderStats(freshStats);
          } catch (err) {
            const msg = err.detail || err.message || 'No se pudo borrar el vídeo.';
            showToast(msg, 'error', 5000);
            btn.disabled = false;
          }
        });
      });
    }

    function statusIcon(status) {
      return {
        uploaded: 'clock',
        processing: 'loader',
        done: 'check-circle',
        failed: 'x-circle',
      }[status] || 'circle';
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }

    /* ===== F9.6: hover preview manager =====
     * Estado global: solo un preview activo a la vez. Si el usuario
     * pasa de una card a otra rapidamente cancelamos el fetch en curso
     * mediante `activeRequestId`. Liberamos el blob URL en cada cambio
     * para evitar fugas de memoria. */
    const HOVER_DELAY_MS = 500;
    let hoverEl = null;
    let hoverUrl = null;
    let activeRequestId = 0;  // contador monotonico

    function destroyHoverPreview() {
      if (hoverEl) { hoverEl.remove(); hoverEl = null; }
      if (hoverUrl) { URL.revokeObjectURL(hoverUrl); hoverUrl = null; }
    }

    function placeHoverPreview(anchor, el) {
      // Posicionamos a la derecha de la card. Si no cabe, intentamos
      // por la izquierda; si tampoco, lo apilamos abajo.
      const rect = anchor.getBoundingClientRect();
      const margin = 8;
      const W = 220;
      const H = Math.round(W * 9 / 16);
      let left = rect.right + margin;
      let top = rect.top;
      if (left + W > window.innerWidth - 8) {
        left = rect.left - W - margin;
        if (left < 8) {
          left = Math.max(8, Math.min(rect.left, window.innerWidth - W - 8));
          top = rect.bottom + margin;
        }
      }
      // Clamp vertical para que no se salga abajo.
      if (top + H > window.innerHeight - 8) top = window.innerHeight - H - 8;
      el.style.left = left + 'px';
      el.style.top = top + 'px';
    }

    function attachHoverPreview(card, videoId) {
      let timer = null;

      card.addEventListener('mouseenter', () => {
        timer = setTimeout(async () => {
          const myReq = ++activeRequestId;
          try {
            const video = await getVideo(videoId);
            if (myReq !== activeRequestId) return;  // hover ya cambio
            if (!video.clips || !video.clips.length) return;
            const url = await fetchClipBlobUrl(video.clips[0].id, 'stream');
            if (myReq !== activeRequestId) {
              URL.revokeObjectURL(url);
              return;
            }
            // Recambio: limpia el preview anterior y monta el nuevo.
            destroyHoverPreview();
            hoverUrl = url;
            hoverEl = document.createElement('div');
            hoverEl.className = 'hover-preview';
            hoverEl.innerHTML = `<video autoplay muted loop playsinline src="${url}"></video>`;
            document.body.appendChild(hoverEl);
            placeHoverPreview(card, hoverEl);
            // Reflow + show para activar la transicion.
            // eslint-disable-next-line no-unused-expressions
            hoverEl.offsetHeight;
            hoverEl.classList.add('hover-preview-show');
          } catch (_) { /* silencioso: si el preview falla, no molestamos */ }
        }, HOVER_DELAY_MS);
      });

      card.addEventListener('mouseleave', () => {
        if (timer) { clearTimeout(timer); timer = null; }
        // Cualquier fetch en curso queda invalidado (incrementamos id).
        activeRequestId++;
        destroyHoverPreview();
      });
    }

    // Si el usuario navega a otra pagina (o cierra) limpiamos el blob.
    window.addEventListener('beforeunload', destroyHoverPreview);

    (async () => {
      try {
        const me = await getMe();
        userPill.textContent = me.email;
      } catch (err) {
        if (err instanceof ApiError && err.status === 401) return;
        userPill.textContent = '—';
      }
      try {
        // Cargar lista y stats en paralelo. Si stats falla no rompemos
        // el dashboard (Promise.allSettled).
        const [videosRes, statsRes] = await Promise.allSettled([
          listVideos(),
          getMyStats(),
        ]);
        if (videosRes.status === 'fulfilled') {
          renderVideos(videosRes.value);
        } else {
          slot.innerHTML = '';
          showAlert('error', videosRes.reason?.detail || 'No se pudieron cargar los vídeos.');
        }
        if (statsRes.status === 'fulfilled') {
          renderStats(statsRes.value);
        }
      } catch (err) {
        slot.innerHTML = '';
        showAlert('error', err.detail || 'No se pudieron cargar los vídeos.');
      }
    })();
  </script>
</body>
</html>
