<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClipCatcher · Mi cuenta</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <a class="brand" href="dashboard.html">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3Z"/>
          <path d="m6.2 5.3 3.1 3.9"/>
          <path d="m12.4 3.4 3.1 4"/>
          <path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>
        </svg>
        <span class="brand-text">ClipCatcher</span>
      </a>
      <div class="row">
        <span class="user-pill" id="user-pill">…</span>
        <a class="btn btn-ghost" href="account.html">
          <i data-lucide="settings"></i> Mi cuenta
        </a>
        <button class="btn btn-ghost" id="btn-logout" type="button">
          <i data-lucide="log-out"></i> Cerrar sesión
        </button>
      </div>
    </header>

    <section class="card card-narrow" style="margin: 0 auto;">
      <h1>Mi cuenta</h1>
      <p class="lead">Personaliza cómo ClipCatcher detecta y recorta tus clips.</p>

      <div id="alert-slot"></div>

      <h2 style="margin-top: 18px;">Configuración del detector</h2>

      <form id="form-settings">
        <div class="field">
          <label for="chain_window_seconds">Ventana de encadenamiento (s)</label>
          <input id="chain_window_seconds" name="chain_window_seconds" type="number" step="0.5" min="1" max="60" required>
          <p class="text-mute" style="font-size: 13px; margin-top: 4px;">
            Tiempo máximo entre kills para agruparlas en un mismo clip. Default 6 s.
          </p>
        </div>

        <div class="field">
          <label for="clip_margin_seconds">Margen del clip (s)</label>
          <input id="clip_margin_seconds" name="clip_margin_seconds" type="number" step="0.5" min="0" max="10" required>
          <p class="text-mute" style="font-size: 13px; margin-top: 4px;">
            Segundos extra al inicio y final de cada clip. Default 2 s.
          </p>
        </div>

        <div class="field">
          <label for="clip_duration_seconds">Duración base del clip (s)</label>
          <input id="clip_duration_seconds" name="clip_duration_seconds" type="number" step="0.5" min="1" max="60" required>
          <p class="text-mute" style="font-size: 13px; margin-top: 4px;">
            Duración mínima del clip. Default 6 s.
          </p>
        </div>

        <div class="row row-end">
          <button type="submit" class="btn btn-primary" id="btn-save">
            <i data-lucide="save"></i>
            <span id="btn-save-label">Guardar</span>
          </button>
        </div>
      </form>
    </section>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module">
    import { getMe, getMySettings, updateMySettings, ApiError } from './js/api.js';
    import { requireAuth, logout } from './js/auth.js';
    import { showToast } from './js/toast.js';

    if (!requireAuth()) throw new Error('redirigiendo');
    if (window.lucide) window.lucide.createIcons();

    const userPill = document.getElementById('user-pill');
    const form = document.getElementById('form-settings');
    const alertSlot = document.getElementById('alert-slot');
    const btn = document.getElementById('btn-save');
    const btnLabel = document.getElementById('btn-save-label');
    const fields = ['chain_window_seconds', 'clip_margin_seconds', 'clip_duration_seconds'];

    document.getElementById('btn-logout').addEventListener('click', logout);

    function showAlert(kind, msg) {
      // Mantenemos esta funcion solo para el error de carga inicial de
      // settings (caso raro pero importante: si no podemos leer la
      // configuracion el form quedaria vacio y un toast efimero no
      // ayudaria al usuario a entender por que). El resto pasa a toast.
      alertSlot.innerHTML = `<div class="alert alert-${kind}">${msg}</div>`;
    }
    function clearAlert() { alertSlot.innerHTML = ''; }

    function fillForm(settings) {
      for (const f of fields) {
        document.getElementById(f).value = settings[f];
      }
    }

    function readForm() {
      const out = {};
      for (const f of fields) {
        out[f] = parseFloat(document.getElementById(f).value);
      }
      return out;
    }

    function formatPydanticErrors(body) {
      if (!body || !Array.isArray(body.detail)) return null;
      return body.detail.map(err => {
        const field = (err.loc || []).filter(p => p !== 'body').join('.');
        return field ? `${field}: ${err.msg}` : err.msg;
      }).join('; ');
    }

    (async () => {
      try {
        const me = await getMe();
        userPill.textContent = me.email;
      } catch (err) {
        if (err instanceof ApiError && err.status === 401) return;
        userPill.textContent = '—';
      }
      try {
        const settings = await getMySettings();
        fillForm(settings);
      } catch (err) {
        showAlert('error', `No se pudo cargar la configuración: ${err.detail || err.message}`);
      }
    })();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAlert();
      btn.disabled = true; btnLabel.textContent = 'Guardando…';
      try {
        const updated = await updateMySettings(readForm());
        fillForm(updated);
        showToast('Configuración guardada', 'success');
      } catch (err) {
        let msg = err.detail || 'No se pudo guardar la configuración.';
        if (err instanceof ApiError && err.status === 422) {
          const formatted = formatPydanticErrors(err.body);
          if (formatted) msg = `Valores fuera de rango: ${formatted}`;
        }
        showToast(msg, 'error', 5000);
      } finally {
        btn.disabled = false; btnLabel.textContent = 'Guardar';
      }
    });
  </script>
</body>
</html>
