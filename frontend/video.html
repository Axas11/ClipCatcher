<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClipCatcher · Detalle de vídeo</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <a class="brand" href="dashboard.html">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3Z"/>
          <path d="m6.2 5.3 3.1 3.9"/>
          <path d="m12.4 3.4 3.1 4"/>
          <path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>
        </svg>
        <span class="brand-text">ClipCatcher</span>
      </a>
      <div class="row">
        <span class="user-pill" id="user-pill">…</span>
        <a class="btn btn-ghost" href="account.html">
          <i data-lucide="settings"></i> Mi cuenta
        </a>
        <button class="btn btn-ghost" id="btn-logout" type="button">
          <i data-lucide="log-out"></i> Cerrar sesión
        </button>
      </div>
    </header>

    <section>
      <div class="row" style="margin-bottom: var(--space-3);">
        <a class="btn btn-ghost" href="dashboard.html">← Volver</a>
      </div>

      <div id="alert-slot"></div>

      <div id="detail-slot">
        <div class="row" style="justify-content: center; padding: 40px 0;">
          <span class="spinner"></span>
          <span class="text-mute">Cargando detalle…</span>
        </div>
      </div>
    </section>
  </main>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module">
    import { getVideo, getMe, fetchClipBlobUrl, ApiError } from './js/api.js';
    import { requireAuth, logout } from './js/auth.js';
    import { showToast } from './js/toast.js';

    // Drena el toast dejado por upload.html tras una subida exitosa.
    const _toastUpload = sessionStorage.getItem('toast.upload.success');
    if (_toastUpload) {
      sessionStorage.removeItem('toast.upload.success');
      showToast(_toastUpload, 'success');
    }

    if (!requireAuth()) throw new Error('redirigiendo');

    if (window.lucide) window.lucide.createIcons();

    function statusIcon(status) {
      return {
        uploaded: 'clock',
        processing: 'loader',
        done: 'check-circle',
        failed: 'x-circle',
      }[status] || 'circle';
    }
    function renderIcons() {
      if (window.lucide) window.lucide.createIcons();
    }

    const POLL_MS = 5000;
    const params = new URLSearchParams(location.search);
    const videoId = parseInt(params.get('id'), 10);

    const userPill = document.getElementById('user-pill');
    const slot = document.getElementById('detail-slot');
    const alertSlot = document.getElementById('alert-slot');
    document.getElementById('btn-logout').addEventListener('click', logout);

    if (!videoId || Number.isNaN(videoId)) {
      slot.innerHTML = `<div class="alert alert-error">URL inválida: falta el id del vídeo.</div>`;
      throw new Error('id invalido');
    }

    function showAlert(kind, msg) {
      alertSlot.innerHTML = `<div class="alert alert-${kind}">${msg}</div>`;
    }
    function clearAlert() { alertSlot.innerHTML = ''; }
    function fmtDate(iso) {
      try { return new Date(iso).toLocaleString('es-ES'); } catch (_) { return iso; }
    }
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      }[c]));
    }

    let pollTimer = null;
    let loadedClipUrls = new Set();  // para revocar object URLs al recargar
    let lastStatus = null;  // para detectar la transicion processing -> done

    function renderProcessing(video) {
      const since = video.uploaded_at ? `desde ${fmtDate(video.uploaded_at)}` : '';
      // Solo redibujamos si el contenido aun no es de "processing".
      // En polls sucesivos el HTML no cambia, evitamos re-render innecesario.
      if (slot.dataset.stage === 'processing') return;
      slot.dataset.stage = 'processing';
      slot.innerHTML = `
        <div id="stage-processing" class="stage-fade">
          <h1>${escapeHtml(video.original_filename)}</h1>
          <p class="mono">#${video.id} · subido ${since}</p>
          <div class="processing-banner">
            <span class="spinner"></span>
            <div>
              <strong>Procesando…</strong> ClipCatcher está analizando los frames y generando los clips.
              Refrescamos automáticamente cada ${POLL_MS / 1000} s.
            </div>
          </div>
          <p class="text-mute">Estado actual:
            <span class="status status-${video.status} spin-loader">
              <i data-lucide="${statusIcon(video.status)}"></i>${video.status}
            </span>
          </p>
        </div>`;
      renderIcons();
    }

    function renderFailed(video) {
      slot.innerHTML = `
        <h1>${escapeHtml(video.original_filename)}</h1>
        <p class="mono">#${video.id} · subido ${fmtDate(video.uploaded_at)}</p>
        <div class="row" style="margin-bottom: var(--space-3);">
          <span class="status status-failed">
            <i data-lucide="x-circle"></i>failed
          </span>
        </div>
        <div class="alert alert-error">
          <strong>El procesamiento ha fallado.</strong>
          Revisa los logs del backend o intenta subir el vídeo de nuevo.
        </div>`;
      renderIcons();
    }

    async function renderDone(video, animate) {
      const clipsHtml = video.clips.length
        ? `<div class="card-grid" id="clips-grid"></div>`
        : `<div class="empty">
             <h3>El vídeo se procesó sin highlights detectados.</h3>
             <p>El detector visual no encontró kills en el killfeed. Prueba con otra grabación.</p>
           </div>`;
      const initClass = animate ? 'stage-fade stage-fade-in-init' : 'stage-fade';
      slot.dataset.stage = 'done';
      slot.innerHTML = `
        <div id="stage-done" class="${initClass}">
          <h1>${escapeHtml(video.original_filename)}</h1>
          <p class="mono">#${video.id} · subido ${fmtDate(video.uploaded_at)} · procesado ${fmtDate(video.processed_at)}</p>
          <div class="row" style="margin-bottom: var(--space-4);">
            <span class="status status-done">
              <i data-lucide="check-circle"></i>done
            </span>
            <span class="text-mute">${video.clips.length} clip(s) generados</span>
          </div>
          ${clipsHtml}
        </div>`;
      renderIcons();
      if (animate) {
        // Forzar reflow para que la transicion entre las dos clases
        // (init -> in) tenga punto de partida y de llegada.
        const stage = document.getElementById('stage-done');
        // eslint-disable-next-line no-unused-expressions
        stage.offsetHeight;
        stage.classList.remove('stage-fade-in-init');
        stage.classList.add('stage-fade-in');
      }

      if (!video.clips.length) return;

      const grid = document.getElementById('clips-grid');
      // Render skeleton inicial.
      grid.innerHTML = video.clips.map(c => `
        <div class="clip-card" data-clip-id="${c.id}">
          <div class="clip-meta">clip #${c.id} · ${c.start_time.toFixed(1)}s → ${c.end_time.toFixed(1)}s · ${(c.end_time - c.start_time).toFixed(1)}s</div>
          <div class="row" style="justify-content: center; padding: 30px 0;">
            <span class="spinner"></span>
            <span class="text-mute">Cargando…</span>
          </div>
        </div>`).join('');

      // Carga blob URLs en paralelo y rellena cada card.
      await Promise.all(video.clips.map(async (c) => {
        const card = grid.querySelector(`[data-clip-id="${c.id}"]`);
        try {
          const streamUrl = await fetchClipBlobUrl(c.id, 'stream');
          loadedClipUrls.add(streamUrl);
          card.innerHTML = `
            <div class="clip-meta">clip #${c.id} · ${c.start_time.toFixed(1)}s → ${c.end_time.toFixed(1)}s · ${(c.end_time - c.start_time).toFixed(1)}s</div>
            <video controls preload="metadata" src="${streamUrl}"></video>
            <div class="row row-end">
              <button class="btn" data-download="${c.id}" type="button">
                <i data-lucide="download"></i> Descargar
              </button>
            </div>`;
          renderIcons();
          card.querySelector('[data-download]').addEventListener('click', () => downloadClip(c.id));
        } catch (err) {
          card.innerHTML = `
            <div class="clip-meta">clip #${c.id}</div>
            <div class="alert alert-error">No se pudo cargar el clip (${err.detail || err.message}).</div>`;
        }
      }));
    }

    async function downloadClip(clipId) {
      try {
        const url = await fetchClipBlobUrl(clipId, 'download');
        const a = document.createElement('a');
        a.href = url;
        a.download = `clip_${clipId}.mp4`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        // Liberar la URL despues de un margen (descarga ya iniciada).
        setTimeout(() => URL.revokeObjectURL(url), 4000);
      } catch (err) {
        showAlert('error', `No se pudo descargar el clip: ${err.detail || err.message}`);
      }
    }

    function revokeLoadedUrls() {
      for (const u of loadedClipUrls) URL.revokeObjectURL(u);
      loadedClipUrls.clear();
    }

    async function refresh() {
      try {
        const video = await getVideo(videoId);
        clearAlert();
        document.title = `ClipCatcher · ${video.original_filename}`;
        const wasProcessing = lastStatus === 'processing' || lastStatus === 'uploaded';
        if (video.status === 'done') {
          revokeLoadedUrls();
          if (wasProcessing) {
            // Transicion suave: fade-out del bloque processing,
            // luego fade-in del bloque done. ~300ms cada lado.
            const old = document.getElementById('stage-processing');
            if (old) {
              old.classList.add('stage-fade-out');
              await new Promise(r => setTimeout(r, 300));
            }
            await renderDone(video, /*animate=*/true);
            const n = video.clips.length;
            const msg = n === 0
              ? 'Procesado completado, sin highlights detectados'
              : `Procesado completado, ${n} clip${n === 1 ? '' : 's'} generado${n === 1 ? '' : 's'}`;
            showToast(msg, 'success', 4000);
          } else {
            // Llegamos directamente a done (recarga de pagina). Sin
            // animacion, queda como antes.
            await renderDone(video, /*animate=*/false);
          }
          if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
        } else if (video.status === 'failed') {
          renderFailed(video);
          if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
        } else {
          renderProcessing(video);
        }
        lastStatus = video.status;
      } catch (err) {
        slot.innerHTML = '';
        if (err instanceof ApiError && err.status === 404) {
          showAlert('error', 'Vídeo no encontrado o sin permiso para verlo.');
        } else {
          showAlert('error', err.detail || 'Error cargando el detalle.');
        }
        if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
      }
    }

    (async () => {
      try {
        const me = await getMe();
        userPill.textContent = me.email;
      } catch (err) {
        if (err instanceof ApiError && err.status === 401) return;
        userPill.textContent = '—';
      }
      await refresh();
      pollTimer = setInterval(refresh, POLL_MS);
    })();

    window.addEventListener('beforeunload', revokeLoadedUrls);
  </script>
</body>
</html>
