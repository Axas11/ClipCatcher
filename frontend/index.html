<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClipCatcher · Iniciar sesión</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="auth-shell">
    <section class="card card-narrow">
      <div class="row row-between" style="margin-bottom: 18px;">
        <div class="brand">
          <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.2 6 3 11l-.9-2.4c-.3-1.1.3-2.2 1.3-2.5l13.5-4c1.1-.3 2.2.3 2.5 1.3Z"/>
            <path d="m6.2 5.3 3.1 3.9"/>
            <path d="m12.4 3.4 3.1 4"/>
            <path d="M3 11h18v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/>
          </svg>
          <span class="brand-text">ClipCatcher</span>
        </div>
        <span class="tag">demo · TFG</span>
      </div>
      <p class="lead">Detecta highlights en tus partidas y conviértelos en clips listos para compartir.</p>

      <div class="tabs">
        <button class="tab active" data-tab="login" type="button">Iniciar sesión</button>
        <button class="tab" data-tab="register" type="button">Crear cuenta</button>
      </div>

      <div id="alert-slot"></div>

      <form id="form-login" autocomplete="on">
        <div class="field">
          <label for="login-email">Email</label>
          <input id="login-email" name="email" type="email" required autocomplete="email" placeholder="tu@email.com">
        </div>
        <div class="field">
          <label for="login-password">Contraseña</label>
          <input id="login-password" name="password" type="password" required autocomplete="current-password" placeholder="········">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btn-login">Entrar</button>
      </form>

      <form id="form-register" class="hidden" autocomplete="on">
        <div class="field">
          <label for="reg-name">Nombre</label>
          <input id="reg-name" name="name" type="text" required minlength="1" maxlength="120" autocomplete="name" placeholder="Tu nombre">
        </div>
        <div class="field">
          <label for="reg-email">Email</label>
          <input id="reg-email" name="email" type="email" required autocomplete="email" placeholder="tu@email.com">
        </div>
        <div class="field">
          <label for="reg-password">Contraseña <span class="text-mute">(mínimo 8 caracteres)</span></label>
          <input id="reg-password" name="password" type="password" required minlength="8" maxlength="128" autocomplete="new-password" placeholder="········">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btn-register">Crear cuenta</button>
      </form>
    </section>
  </main>

  <script type="module">
    import { login, register, ApiError } from './js/api.js';
    import { saveToken, getToken } from './js/auth.js';

    // Si ya hay token, ir directos al dashboard.
    if (getToken()) location.replace('dashboard.html');

    const tabs = document.querySelectorAll('.tab');
    const formLogin = document.getElementById('form-login');
    const formRegister = document.getElementById('form-register');
    const alertSlot = document.getElementById('alert-slot');

    function showAlert(kind, msg) {
      alertSlot.innerHTML = `<div class="alert alert-${kind}">${msg}</div>`;
    }
    function clearAlert() { alertSlot.innerHTML = ''; }

    tabs.forEach(btn => btn.addEventListener('click', () => {
      tabs.forEach(b => b.classList.toggle('active', b === btn));
      const tab = btn.dataset.tab;
      formLogin.classList.toggle('hidden', tab !== 'login');
      formRegister.classList.toggle('hidden', tab !== 'register');
      clearAlert();
    }));

    formLogin.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAlert();
      const btn = document.getElementById('btn-login');
      btn.disabled = true; btn.textContent = 'Entrando…';
      try {
        const data = await login({
          email: formLogin.email.value.trim(),
          password: formLogin.password.value,
        });
        saveToken(data.access_token);
        location.replace('dashboard.html');
      } catch (err) {
        const msg = err instanceof ApiError && err.status === 401
          ? 'Credenciales inválidas.'
          : (err.detail || 'No se pudo iniciar sesión.');
        showAlert('error', msg);
        btn.disabled = false; btn.textContent = 'Entrar';
      }
    });

    formRegister.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAlert();
      const btn = document.getElementById('btn-register');
      btn.disabled = true; btn.textContent = 'Creando cuenta…';
      try {
        const data = await register({
          name: formRegister.name.value.trim(),
          email: formRegister.email.value.trim(),
          password: formRegister.password.value,
        });
        saveToken(data.token.access_token);
        location.replace('dashboard.html');
      } catch (err) {
        let msg = err.detail || 'No se pudo crear la cuenta.';
        if (err instanceof ApiError && err.status === 409) {
          msg = 'Ya existe una cuenta con ese email.';
        } else if (err instanceof ApiError && err.status === 422) {
          msg = 'Revisa los datos: email válido y contraseña de al menos 8 caracteres.';
        }
        showAlert('error', msg);
        btn.disabled = false; btn.textContent = 'Crear cuenta';
      }
    });
  </script>
</body>
</html>
